<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; }
  .hero img { width: 240px; height: 240px; object-fit: contain; filter: drop-shadow(0 30px 60px rgba(245,148,51,.35)); }
  .hero h2 { font-size: 84px; }
  .hero .lead { max-width: 820px; }
  .cta { display: inline-flex; align-items: center; gap: 16px; background: var(--brand); color: #fff; font-weight: 800; font-size: 40px; padding: 24px 54px; border-radius: 999px; box-shadow: 0 20px 60px rgba(245,148,51,.45); }
  .badges { display: flex; gap: 16px; }
  .badge { display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 14px 24px; font-size: 26px; font-weight: 700; direction: ltr; }
  .badge .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  .tagline { font-size: 34px; color: var(--muted); font-weight: 500; }
  .tagline b { color: var(--brand); font-weight: 800; }
</style></head>
<body><div class="glow"></div>
<div class="slide">
  <div class="top"><div class="logo"><img src="assets/k.png" alt=""><span>Kwill</span></div><div class="counter">9 / 9</div></div>
  <div class="mid">
    <div class="hero">
      <img src="assets/k.png" alt="Kwill">
      <h2>ابدأ مذكرتك <span class="hl">اليوم</span></h2>
      <p class="lead">استورد مذكرتك أو ابدأ من قالب جامعتك — <b>وشوف الفرق على مذكرتك أنت</b> في أول جلسة.</p>
      <div class="cta">حمّل Kwill — الرابط في البيو</div>
      <div class="badges"><div class="badge"><span class="dot"></span>Android · Google Play</div><div class="badge">AR · FR · EN</div></div>
      <div class="tagline"><b>Kwill</b> ينسّق ويُنظّم — أنت من يكتب.</div>
    </div>
  </div>
  <div class="foot"><span>شارك الفيديو مع صاحبك اللي مازال يكتب الفهرس بيده 😅</span><span class="swipe">Kwill</span></div>
</div>
</body></html>
