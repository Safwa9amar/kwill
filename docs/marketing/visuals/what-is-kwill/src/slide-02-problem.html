<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .pain { display: flex; align-items: center; gap: 22px; padding: 28px 30px; }
  .pain .t { font-size: 31px; font-weight: 700; line-height: 1.35; }
</style></head>
<body><div class="glow"></div>
<div class="slide">
  <div class="top"><div class="logo"><img src="assets/k.png" alt=""><span>Kwill</span></div><div class="counter">2 / 9</div></div>
  <div class="mid">
    <div>
      <div class="kicker">المشكلة</div>
      <h2>تعرف هذا المشهد؟</h2>
    </div>
    <div class="grid2">
      <div class="card pain"><div class="ic bad">≡</div><div class="t">الفهرس ينكسر كل ما تزيد صفحة</div></div>
      <div class="card pain"><div class="ic bad">▦</div><div class="t">الجداول تنقلب في المذكرة العربية</div></div>
      <div class="card pain"><div class="ic bad">#</div><div class="t">الترقيم والعناوين فوضى</div></div>
      <div class="card pain"><div class="ic bad">✕</div><div class="t">المشرف يردّ المذكرة «على الشكل»</div></div>
    </div>
    <div class="quote">«التنسيق غير مقبول. أعد النظر في الشكل كاملاً.»<span class="who">— رسالة المشرف، قبل المناقشة بثلاثة أسابيع</span></div>
  </div>
  <div class="foot"><span>المحتوى ممتاز… والشكل يخسّره</span><span class="swipe">← اسحب</span></div>
</div>
</body></html>
