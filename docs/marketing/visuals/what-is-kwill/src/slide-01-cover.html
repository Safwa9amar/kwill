<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px; }
  .hero img { width: 300px; height: 300px; object-fit: contain; filter: drop-shadow(0 30px 60px rgba(245,148,51,.35)); }
  .hero h1 { margin-top: -22px; }
  .hero .tag { font-size: 62px; font-weight: 800; color: var(--brand); line-height: 1.2; }
  .hero .lead { max-width: 860px; }
</style></head>
<body><div class="glow"></div>
<div class="slide">
  <div class="top"><div class="logo"><img src="assets/k.png" alt=""><span>Kwill</span></div><div class="counter">1 / 9</div></div>
  <div class="mid">
    <div class="hero">
      <img src="assets/k.png" alt="Kwill">
      <h1>Kwill</h1>
      <div class="tag">المُنسِّق الشخصي لمذكرتك</div>
      <p class="lead">مذكرة التخرج من <b>كابوس تنسيق</b> إلى <b>ملف Word جاهز للمناقشة</b> — بالعربية والفرنسية، وعلى معايير جامعتك.</p>
      <div class="fr">Ton mémoire, prêt pour la soutenance.</div>
    </div>
  </div>
  <div class="foot"><span>واش هو Kwill؟ وكيفاش يخدم؟</span><span class="swipe">← اسحب</span></div>
</div>
</body></html>
